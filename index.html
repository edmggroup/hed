<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save Ravi!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap">
<style>
:root{
  --p:#7030A0; --pd:#4B1F6F; --pt:#F3ECF9; --navy:#0D5293; --ink:#1B1B22; --muted:#5E5E6E; --bg:#F7F4FB; --card:#fff; --line:#E4DCEF;
  --A:#B91C1C; --At:#FEE2E2; --B:#15803D; --Bt:#DCFCE7; --gold:#C88A12;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --serif:"IBM Plex Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
.fitbox{position:relative;overflow:hidden;min-height:0}
.fit{transform-origin:top left}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.15;color:var(--pd)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--p);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn.light{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn[disabled]{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.hide{display:none!important}
.disc{font-size:.72rem;color:var(--muted);text-align:center;max-width:900px;margin:14px auto 0;line-height:1.35}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--pd);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast a{color:#FFE29A;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,10,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:22px;max-width:860px;max-height:92vh;overflow:auto;width:100%;display:flex;flex-direction:column;gap:12px}
.e{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1}

/* ---------- teacher ---------- */
.T{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{background:var(--p);color:#fff;display:flex;align-items:center;gap:12px;padding:6px 16px;flex-wrap:nowrap;flex:0 0 auto}
.bar .logo{font-family:var(--serif);font-weight:700;font-size:1.3rem}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.9rem}
.live{display:flex;align-items:center;gap:8px}
.live i{width:9px;height:9px;border-radius:50%;background:#7CF0A8;box-shadow:0 0 0 4px rgba(124,240,168,.25)}
.sp{flex:1}
.miniqr{background:#fff;border-radius:8px;padding:3px;height:40px;cursor:pointer}
.stage{flex:1;width:100%}
.stage .fit{padding:clamp(10px,2vh,22px) clamp(14px,2.5vw,40px);display:flex;flex-direction:column;gap:clamp(8px,1.6vh,18px);max-width:1500px;margin:0 auto;box-sizing:border-box}
.ctl{background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:6px 14px;flex-wrap:nowrap;overflow:hidden;flex:0 0 auto}
.ctl .btn.small{padding:6px 10px}
.ctl select{border:1px solid var(--line);border-radius:10px;padding:8px}
.kick{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--p);font-weight:700}
.h1{font-size:clamp(1.5rem,min(3.4vw,5.5vh),2.8rem)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(10px,2vh,20px)}
.scene{border-radius:24px;aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;gap:4%;position:relative;overflow:hidden;color:#fff}
.scene .e{font-size:clamp(2.4rem,min(8vw,13vh),7.5rem)}
.scene .e.big{font-size:clamp(3rem,min(9vw,15vh),9rem)}
.g2 .scene{aspect-ratio:auto;height:min(30vh,28vw)}
.scene .tb{position:absolute;top:12px;left:14px;background:rgba(0,0,0,.32);padding:4px 14px;border-radius:999px;font-weight:700;font-size:clamp(.85rem,1.5vw,1.2rem)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.story p{margin:0 0 8px;font-size:clamp(1rem,min(1.9vw,3.2vh),1.55rem)}
.story p.q{color:var(--A);font-weight:700;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{border-radius:14px;padding:clamp(6px,1.4vh,14px) 16px;border:2px solid;display:flex;gap:14px;align-items:center}
.opt b.L{font-family:var(--serif);font-size:2.4rem;line-height:1}
.opt .t{font-weight:700;font-size:clamp(1rem,1.7vw,1.35rem)}
.opt small{display:block;color:var(--muted);font-weight:500}
.opt.A{background:var(--At);border-color:var(--A);color:var(--A)} .opt.B{background:var(--Bt);border-color:var(--B);color:var(--B)}
.opt.A .t,.opt.B .t{color:var(--ink)}
.tally{display:grid;gap:clamp(4px,1vh,10px)}
.trow{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center}
.trow .nm{font-weight:700}
.sbar{height:clamp(22px,4vh,34px);border-radius:10px;background:#EEE9F4;display:flex;overflow:hidden}
.sbar span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;transition:width .35s;min-width:0;white-space:nowrap}
.sbar .a{background:var(--A)} .sbar .b{background:var(--B)}
.timer{font-family:var(--serif);font-size:2.4rem;color:var(--A);font-weight:700;min-width:90px;text-align:right}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tcard{border-radius:18px;padding:16px;background:#fff;border:3px solid var(--line);text-align:center;cursor:pointer;user-select:none}
.tcard .L{font-family:var(--serif);font-size:3.6rem;font-weight:700;line-height:1}
.tcard.A{border-color:var(--A);background:var(--At)} .tcard.A .L{color:var(--A)}
.tcard.B{border-color:var(--B);background:var(--Bt)} .tcard.B .L{color:var(--B)}
.tcard .fun{font-weight:700;font-size:1.3rem;color:var(--p)}
.meter{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center}
.mtrack{height:clamp(18px,3.4vh,30px);background:#EEE9F4;border-radius:999px;overflow:hidden}
.mtrack span{display:block;height:100%;border-radius:999px;transition:width .6s}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.qrbig{background:#fff;border-radius:22px;padding:14px;border:1px solid var(--line);text-align:center}
.qrbig img{width:min(58vh,42vw,460px);height:min(58vh,42vw,460px);display:block;image-rendering:pixelated}
.miniqr,.modal img{image-rendering:pixelated}
.jt{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.jt div{border-radius:16px;padding:14px;color:#fff;text-align:center}
.jt b{display:block;font-size:2.2rem;font-family:var(--serif)}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names span{background:var(--pt);color:var(--pd);border-radius:999px;padding:4px 12px;font-size:.95rem;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ends{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.ends .scene .e{font-size:clamp(2.2rem,4vw,3.6rem)}
.marks{font-family:var(--serif);font-size:2rem;color:var(--A);font-weight:700}
table.tt{border-collapse:collapse;width:100%}
table.tt th{background:var(--p);color:#fff;padding:8px;text-align:left}
table.tt td{padding:8px;border-bottom:1px solid var(--line)}
table.tt tr:nth-child(even) td{background:var(--pt)}
.start{max-width:640px;margin:0 auto;padding:2vh 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.start .card{display:flex;flex-direction:column;gap:12px;position:relative}
.start input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.start input:focus{outline:none;border-color:var(--p)}
.tin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:1.6rem;color:var(--muted)}
.recent{display:flex;gap:8px;flex-wrap:wrap}
.recent button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px}
/* engagement */
.fly{position:fixed;bottom:70px;font-size:3rem;pointer-events:none;z-index:45;animation:fly 2.6s ease-out forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:1;transform:translateY(-40px) scale(1.15)}100%{transform:translateY(-70vh) scale(1);opacity:0}}
.tcard.hid,.tcard.hid.A,.tcard.hid.B{background:#fff;border-color:var(--line)}.tcard.hid .L{animation:shake .25s infinite;color:var(--p)!important}
#fm.wait{opacity:0}#fm{transition:opacity .5s}.tcard.hid .body{visibility:hidden}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.tcard.flip{animation:flip .5s}@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.ravi{font-style:italic;color:var(--ink);margin-top:6px;font-size:.98rem}
.notif{display:flex;gap:10px;align-items:center;background:#1F1F27;color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notif.in{animation:slide .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes slide{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.notif .ic{width:38px;height:38px;border-radius:10px;background:var(--p);display:grid;place-items:center;font-size:1.3rem;flex:0 0 auto}
.notif small{display:block;color:#B9B9C6;font-size:.78rem}
.tl{background:var(--pt);border-radius:12px;padding:8px 12px;font-size:.95rem;text-align:center}
.rx{display:flex;justify-content:center;gap:8px}
.rx button{font-size:1.8rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px;line-height:1}
.rx button:active{transform:scale(1.3)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:900px){.g2,.lobby{grid-template-columns:1fr}.trow,.mrow{grid-template-columns:100px 1fr 70px}}

/* ---------- student ---------- */
.S{max-width:520px;margin:0 auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;height:100vh;height:100dvh;box-sizing:border-box}
#sv{flex:1}
#sv .fit{display:flex;flex-direction:column;gap:10px}
.S .top{display:flex;justify-content:space-between;align-items:center}
.S .top b{font-family:var(--serif);color:var(--p);font-size:1.3rem}
.tag{border-radius:999px;padding:4px 12px;color:#fff;font-weight:600;font-size:.9rem}
.S input{border:2px solid var(--line);border-radius:12px;padding:12px;width:100%}
.pickteam{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickteam button{border:3px solid transparent;border-radius:14px;padding:16px 8px;color:#fff;font-weight:700;font-size:1.1rem}
.pickteam button.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}
.vbtn{width:100%;border-radius:16px;padding:clamp(8px,1.8vh,18px) 14px;border:3px solid;text-align:left;display:flex;gap:14px;align-items:center;background:#fff}
.vbtn b{font-family:var(--serif);font-size:2.6rem;line-height:1}
.vbtn .t{font-weight:700;font-size:1.1rem;color:var(--ink)}
.vbtn small{display:block;color:var(--muted)}
.vbtn.A{border-color:var(--A);color:var(--A)} .vbtn.B{border-color:var(--B);color:var(--B)}
.vbtn.A.on{background:var(--A);color:#fff} .vbtn.B.on{background:var(--B);color:#fff}
.vbtn.on .t,.vbtn.on small{color:#fff}
.vbtn[disabled]{opacity:.5}
.S .scene{aspect-ratio:auto;height:clamp(70px,16vh,150px)}
.S .scene .e{font-size:clamp(2rem,8vh,3.4rem)}
.big{font-size:3rem;text-align:center}
.center{text-align:center}
</style>
</head>

      '<p>The hidden <b style="color:var(--B)">Exam meter 🧊</b> was your <b style="color:var(--B)">cool brain</b>: <i>“What’s best for me?”</i></p>' +
      '<p>Ravi didn’t fail because of one big mistake, but <b>eight small choices</b>.</p></div>' +
      '<div class="card meter">' + tot.map((t, k) => '<div><b style="color:' + TC[k] + '">' + esc(t.name) + '</b><div class="mrow" style="grid-template-columns:90px 1fr 60px"><span>🔥 Fun</span><div class="mtrack"><span style="width:' + Math.round(100 * t.fun / 210) + '%;background:var(--A)"></span></div><b>' + t.fun + '</b></div>' +
        '<div class="mrow" style="grid-template-columns:90px 1fr 60px"><span>🧊 Exam</span><div class="mtrack"><span style="width:' + Math.round(100 * t.b / NS) + '%;background:var(--B)"></span></div><b>' + t.b + '/' + NS + '</b></div></div>').join('') + '</div></div>' +
      '<div class="card"><b style="color:var(--p)">What each scene secretly tested</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:6px">' +
      SC.map((s, k) => '<div>' + (k + 1) + '. ' + esc(s.title) + ' → <b>' + esc(s.tests) + '</b></div>').join('') + '</div></div>';
  if (i.p === 'talk') return '<div class="kick">Debrief</div><h1 class="h1">💬 Let’s Talk: Ravi Is Us</h1><div class="g2"><div class="card story"><p><b style="color:var(--p)">Discuss</b></p>' +
      '<p>1. Fun Champions: how does it feel now?</p><p>2. Which scene was hardest to resist? Why?</p><p>3. Did any wise choice still feel fun?</p><p>4. Which of these 8 scenes will happen to you this week?</p></div>' +
      '<div class="card story" style="background:var(--pt)"><p><b style="color:var(--p)">Team task: an If–Then plan</b></p><p>Pick the scene your Ravi failed. Write one plan:</p>' +
      '<p><b style="color:var(--A)">“If</b> <i>a reel autoplays while I’m studying,</i> <b style="color:var(--B)">then</b> <i>I put my phone in my bag for 25 minutes.”</i></p><p class="muted">Read it aloud. The class picks the most practical plan.</p></div></div>' +
      '<h2 class="center" style="color:var(--A);font-style:italic">Self-control isn’t one big moment. It’s a hundred small choices.</h2>';
  return '';
}
function funMeter(tot, big) {
  const mx = Math.max(10, Math.max.apply(null, tot.map(t => t.fun)));
  return '<div class="card meter"><b>🔥 Fun Meter</b>' + tot.map((t, k) => '<div class="mrow"><span style="font-weight:700;color:' + TC[k] + '">' + esc(t.name) + '</span><div class="mtrack" style="' + (big ? 'height:44px' : '') + '"><span style="width:' + Math.round(100 * t.fun / mx) + '%;background:' + TC[k] + '"></span></div><b style="font-size:' + (big ? '1.6rem' : '1.1rem') + '">' + t.fun + ' Fun</b></div>').join('') + '</div>';
}
function updLive() {
  if (!ST || !$('#stage')) return;
  const i = info(ST.step), L = LIVE;
  if (L && $('#jn')) $('#jn').textContent = L.n;
  if (!L) return;
  if (lastN >= 0 && L.n > lastN) SFX.pop(); lastN = L.n;
  if (i.p === 'vote') { if (lastVoted >= 0 && L.voted > lastVoted) SFX.tick(); lastVoted = L.voted; }
  if (i.p === 'lobby') {
    L.teams.forEach((t, k) => { const el = $('#j' + k); if (el) el.textContent = t.j; });
    const nm = $('#names'); if (nm) { const h = L.names.map(n => '<span>' + esc(n) + '</span>').join(''); if (nm.dataset.h !== h) { nm.innerHTML = h; nm.dataset.h = h; fitSoon(); } }
  }
  if (i.p === 'vote' && L.s === i.k) {
    L.teams.forEach((t, k) => { const tot = t.A + t.B, a = $('#a' + k), b = $('#b' + k);
      if (!a) return; a.style.width = (tot ? 100 * t.A / tot : 0) + '%'; b.style.width = (tot ? 100 * t.B / tot : 0) + '%';
      a.textContent = t.A ? 'A ' + t.A : ''; b.textContent = t.B ? 'B ' + t.B : ''; $('#c' + k).textContent = tot + '/' + t.j; });
    $('#vc').textContent = L.voted + ' of ' + L.n + ' voted';
  }
}
async function pollOnce() {
  const i = info(ST.step), s = i.p === 'vote' ? i.k : -1;
  const r = await call('poll', { s: s, gen: ST.gen, nt: ST.teams.length, since: SINCE }, 1);
  if (r && r.ok) { r.s = s; LIVE = r; ST.joined = r.n; updLive();
    (r.re || []).sort((a, b) => a[1] - b[1]).forEach((x, n) => { SINCE = Math.max(SINCE, x[1]); setTimeout(() => flyEmoji(x[0], TC[x[2]]), n * 120); }); }
}
function pollNow() { clearTimeout(pollT); pollT = setTimeout(pollLoop, 30); }
async function pollLoop() {
  clearTimeout(pollT); if (!ST) return;
  const p = info(ST.step).p, fast = p === 'vote' || p === 'lobby';
  try { await pollOnce(); } catch (e) {}
  pollT = setTimeout(pollLoop, fast ? 550 : 900);
}
function tick() {
  clearTimeout(tickT); tickT = setTimeout(tick, 250);
  if (!ST) return; const i = info(ST.step), el = $('#tm');
  if (i.p !== 'vote' || !ST.end) { if (el) el.textContent = ''; return; }
  const left = Math.ceil((ST.end - now()) / 1000);
  if (el) { const t = '⏱ ' + Math.max(0, left); if (el.textContent !== t) { el.textContent = t; if (left > 0 && left <= 5) SFX.beep(); } }
  if (left <= 0 && autoDone !== ST.step) { autoDone = ST.step; next(); }
}
async function resetGame() {
  const v = await modal('<h2>Reset ' + esc(ST.cls) + '?</h2><p class="muted" style="margin:0">All team choices and votes will be cleared.</p>',
    [['Restart (keep students)', 'keep'], ['New game (students rejoin)', 'new', 'ghost'], ['Cancel', null, 'ghost']]);
  if (!v) return;
  const r = await call('init', { fresh: true, keepPlayers: v === 'keep', teams: ST.teams });
  if (r.ok) { ST = r.st; LIVE = null; autoDone = -1; animStep = -1; SINCE = Date.now(); renderT(); pollNow(); toast('Game reset'); }
}
async function report() {
  toast('Saving the report to Drive…', 9000);
  try { const r = await call('report', {}, 1); if (!r.ok) throw r.err;
    toast('Saved in Drive › HED SDSC Reports · <a href="' + r.url + '" target="_blank">Open PDF</a>', 12000); }
  catch (e) { toast('Could not save the report: ' + esc(e)); }
}
document.addEventListener('keydown', e => {
  if (!ST || CFG.cls || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || document.querySelector('.modal')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); if (!$('#nextB').disabled) next(); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); back(); }
});

/* =====================================================================
   STUDENT (phone)
   ===================================================================== */
let joining = false, SS = null, ME = null, MY = '', sT = 0, lastKey = '', voteBusy = false, LV = null, pinged = {}, lastStep = -1, rxAt = 0;
const meKey = () => 'sr:me:' + ckey(CLS);
async function student() {
  CLS = CFG.cls; BACK = backendFor(CLS); ME = store(meKey());
  $('#app').innerHTML = '<div class="S"><div class="top"><b>Save Ravi!</b><span class="muted">' + esc(CLS) + '</span></div><div id="sv" class="fitbox"><div class="fit"><p class="center muted">Connecting…</p>' + disc() + '</div></div></div>';
  sPoll();
}
async function sPoll() {
  clearTimeout(sT);
  let wait = 1800;
  try {
    const i = SS ? info(SS.step) : null, s = i && i.p === 'vote' ? i.k : -1;
    const r = await call('st', { ver: SS ? SS.ver : 0, id: ME ? ME.id : -1, gen: SS ? SS.gen : 0, s: s }, 1);
    if (r.none) { $('#sv').innerHTML = '<div class="fit"><div class="card center"><div class="big e">⏳</div><p>Your teacher hasn’t started <b>' + esc(CLS) + '</b> yet.<br>Keep this page open.</p></div>' + disc() + '</div>'; fitSoon(); }
    else {
      if (r.st) SS = r.st;
      if (ME && ME.created !== SS.created) { ME = null; store(meKey(), null); }
      if (!ME && !joining) sAutoJoin();
      if (!voteBusy) MY = r.my || (r.st ? '' : MY);
      LV = r.lv;
      if (SS.step !== lastStep) { if (lastStep >= 0 && navigator.vibrate) try { navigator.vibrate(info(SS.step).p === 'vote' ? [70, 50, 70] : 40); } catch (e) {} lastStep = SS.step; }
      sRender(); updLV();
      { const p = info(SS.step).p; wait = (p === 'vote' || p === 'result' || p === 'intro' || p === 'lobby') ? 800 : 1300; }   // faster just before/while voting
    }
  } catch (e) { wait = 2500; }
  sT = setTimeout(sPoll, wait + Math.random() * 250);
}
function sRender(force) {
  if (!SS) return;
  const i = info(SS.step), key = [SS.ver, i.p, ME ? ME.id : 'x', MY].join('|');
  if (!force && key === lastKey && i.p !== 'vote') return;
  if (!force && key === lastKey && i.p === 'vote') return sTimer();
  lastKey = key;
  const v = $('#sv');
  if (!ME) { v.innerHTML = '<div class="fit"><div class="card center"><div class="big e">🚀</div><h2>Joining ' + esc(CLS) + '…</h2></div></div>'; fitSoon(); return; }
  const tn = SS.teams[ME.team] || '', col = TC[ME.team], tot = totals(SS)[ME.team];
  const head = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button id="edit" style="background:none;border:0;padding:0;text-align:left">Hi, <b>' + esc(ME.name) + '</b> ✏️</button><button id="edit2" class="tag" style="background:' + col + ';border:0">' + esc(tn) + ' ⇄</button></div>';
  let h = '';
  if (i.p === 'lobby') h = '<div class="card center"><div class="big e">🎉</div><h2>You’re in ' + esc(tn) + '!</h2><p class="muted">Sit with your team and look at the big screen.</p></div><p class="center muted" style="margin:0;font-size:.85rem">Tap ✏️ to add your name or ⇄ to change team.</p>';
  else if (i.p === 'intro') h = sceneCard({ bg: 'linear-gradient(135deg,#312E81,#7030A0)', em: ['🧑‍🎓', '🌙', '📚'], time: 'Room 203' }) + '<div class="card"><h2>Meet Ravi.</h2><p>Exam at <b>9 a.m. tomorrow</b>. Your team decides everything he does tonight. Keep him <b>HAPPY</b>!</p></div>';
  else if (i.p === 'vote') { const s = SC[i.k], first = !pinged[SS.gen + '|' + i.k]; pinged[SS.gen + '|' + i.k] = 1;
    h = '<div class="notif' + (first ? ' in' : '') + '"><div class="ic e">🔔</div><div><small>' + esc(s.ping.from) + ' · now</small><b>' + esc(s.ping.msg) + '</b></div></div>' +
      '<div class="kick">Scene ' + (i.k + 1) + ' of ' + NS + ' · ' + esc(s.time) + ' <span id="stm" style="float:right;color:var(--A)"></span></div>' + sceneCard(s) + '<h2 style="font-size:1.2rem">' + esc(s.title) + '</h2>' +
      ['A', 'B'].map(L => '<button class="vbtn ' + L + (MY === L ? ' on' : '') + '" data-v="' + L + '"><b>' + L + '</b><div><div class="t">' + esc(s[L][0]) + '</div><small>+' + s[L][1] + ' Fun</small></div></button>').join('') +
      '<div class="tl" id="tl">Your team: waiting for votes…</div>' +
      '<p class="center muted" style="margin:0">' + (MY ? '✅ Vote saved: <b>' + MY + '</b>. You can still change it.' : 'Talk with your team, then tap A or B.') + '</p>'; }
  else if (i.p === 'result') { const s = SC[i.k], c = SS.picks[i.k][ME.team];
    h = '<div class="card center"><div class="kick">Scene ' + (i.k + 1) + '</div><p>Your team chose</p><div class="big" style="font-family:var(--serif);font-weight:700;color:' + (c === 'B' ? 'var(--B)' : 'var(--A)') + '">' + (c || '–') + '</div>' +
      (c ? '<p><b>' + esc(s[c][0]) + '</b></p><h2>+' + s[c][1] + ' Fun 🎉</h2><p class="ravi">Ravi: ' + esc(s['r' + c]) + '</p>' : '') + '<p class="muted">Team total: <b>' + tot.fun + ' Fun</b></p></div>'; }
  else if (i.p === 'fun') { const all = totals(SS).slice().sort((a, b) => b.fun - a.fun), rank = all.filter(t => t.fun > tot.fun).length + 1;
    h = '<div class="card center"><div class="big e">' + (rank === 1 ? '👑' : '🎉') + '</div><h2>' + tot.fun + ' Fun points</h2><p>' + esc(tn) + ' is <b>#' + rank + '</b> on the Fun Meter!</p><p class="muted">Look at the big screen… 😏</p></div>'; }
  else if (i.p === 'morning') h = '<div class="kick">Next morning, 9:00 a.m.</div>' + sceneCard(tot.end) + '<div class="card"><p>' + esc(tot.end.text) + '</p><h2 style="color:var(--A)">Marks: ' + tot.end.marks + '</h2></div>';
  else if (i.p === 'reveal') h = '<div class="card"><h2>😲 Surprise! It was a self-control test</h2><p>🔥 <b>Fun meter</b> = hot brain: “I want it NOW.”</p><p>🧊 <b>Exam meter</b> = cool brain: “What’s best for me?”</p><p>Your team’s wise (B) choices: <b>' + tot.b + ' of ' + NS + '</b></p></div>';
  else if (i.p === 'talk') h = '<div class="card"><h2>📝 Your If–Then plan</h2><p>Pick the scene your Ravi failed and finish this with your team:</p><p><b style="color:var(--A)">If</b> … <b style="color:var(--B)">then</b> I will …</p><p class="muted">Self-control isn’t one big moment. It’s a hundred small choices.</p></div>';
  if (i.p !== 'vote') h += '<div class="rx">' + CFG.emojis.map(e => '<button class="e" data-rx="' + e + '">' + e + '</button>').join('') + '</div><p class="center muted" style="margin:0;font-size:.8rem">Tap to react on the big screen</p>';
  if (i.p === 'lobby') h += disc();
  v.innerHTML = '<div class="fit">' + head + h + '</div>'; fitSoon();
  document.querySelectorAll('[data-rx]').forEach(b => b.onclick = () => sReact(b.dataset.rx, b));
  if ($('#edit')) $('#edit').onclick = $('#edit2').onclick = sEdit;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => sVote(b.dataset.v));
  sTimer();
}
function updLV() {
  const el = $('#tl'); if (!el || !ME) return;
  const t = LV && LV[ME.team]; if (!t) return;
  const txt = 'Your team right now: <b style="color:var(--A)">A ' + t[0] + '</b> · <b style="color:var(--B)">B ' + t[1] + '</b> (' + (t[0] + t[1]) + ' of ' + t[2] + ' voted)';
  if (el.innerHTML !== txt) el.innerHTML = txt;
}
function sReact(e, b) {
  if (Date.now() - rxAt < 1200) return; rxAt = Date.now();
  b.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], 300);
  if (navigator.vibrate) try { navigator.vibrate(20); } catch (x) {}
  call('react', { id: ME.id, e: e }, 1).catch(() => {});
}
function sTimer() {
  clearTimeout(sTimer.t); const el = $('#stm'); if (!el || !SS || !SS.end) { if (el) el.textContent = ''; return; }
  const left = Math.ceil((SS.end - now()) / 1000); el.textContent = '⏱ ' + Math.max(0, left);
  if (left <= 0) document.querySelectorAll('[data-v]').forEach(b => b.disabled = true);
  else sTimer.t = setTimeout(sTimer, 300);
}
async function sVote(c) {
  const i = info(SS.step); if (i.p !== 'vote') return;
  const prev = MY; MY = c; voteBusy = true; sRender(true);
  try { const r = await call('vote', { id: ME.id, gen: SS.gen, s: i.k, c: c });
    if (!r.ok) { MY = prev; if (r.err === 'rejoin') { ME = null; store(meKey(), null); } toast(esc(r.err === 'rejoin' ? 'Please join again' : r.err)); } }
  catch (e) { MY = prev; toast('Network problem. Tap again.'); }
  voteBusy = false; sRender(true); updLV();
}
async function sAutoJoin() {                          // scan → in a team instantly, no form
  joining = true;
  try {
    const r = await call('join', { name: store('sr:name') || '', team: CFG.team }, 4);
    if (r.ok) { ME = { id: r.id, team: r.team, name: r.name, created: SS.created }; store(meKey(), ME); lastKey = ''; sRender(true);
      if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} }
  } catch (e) {}
  joining = false;
}
async function sEdit() {
  if (document.querySelector('.modal')) return;
  let team = ME.team, name = null;
  const p = modal('<h2>You</h2><input id="enm" placeholder="Your name (optional)" maxlength="30" value="' + esc(/^Player \d+$/.test(ME.name) ? '' : ME.name) + '" style="border:2px solid var(--line);border-radius:12px;padding:12px">' +
    '<b>Team</b><div class="pickteam">' + SS.teams.map((t, k) => '<button data-et="' + k + '" class="' + (k === ME.team ? 'on' : '') + '" style="background:' + TC[k] + '">' + esc(t) + '</button>').join('') + '</div>',
    [['Save', 'save'], ['Cancel', null, 'ghost']]);
  setTimeout(() => document.querySelectorAll('[data-et]').forEach(b => b.onclick = () => document.querySelectorAll('[data-et]').forEach(x => x.classList.toggle('on', x === b))), 0);
  if (await p !== 'save') return;
  name = modal.input; if (modal.team != null) team = modal.team;
  const req = { id: ME.id };
  if (name != null && name.trim()) { req.name = name.trim(); store('sr:name', req.name); }
  if (team !== ME.team) req.team = team;
  if (req.name == null && req.team == null) return;
  try { const r = await call('rename', req);
    if (r.ok) { ME.name = r.name; ME.team = r.team; store(meKey(), ME); lastKey = ''; sRender(true); updLV(); toast('Saved ✅'); }
    else if (r.err === 'rejoin') { ME = null; store(meKey(), null); } else toast(esc(r.err)); }
  catch (e) { toast('Network problem. Try again.'); }
}
// ---------- boot ----------
if (CFG.cls) student(); else { startScreen(false); tick(); }
</script>
